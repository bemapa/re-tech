<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="R&amp;E Tech Eletrônicos — tecnologia que facilita sua vida! Eletrodomésticos e eletrônicos por cômodo.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>R&amp;E Tech Eletrônicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style id="app-css">
/* Layout: topo com logo + abas (gestão) ou vitrine em grade por cômodo (clientes). Uma coluna larga, cards que viram 2 colunas no celular. */
/* Marca R&E Tech: laranja #FC5315, âmbar #FF9300, grafite #2C2D32, azul #0DC6FF sobre preto. Tema único escuro, igual ao logotipo. */
:root{
  --bg:#09090C; --surface:#16171B; --surface-2:#2C2D32; --line:#33353C;
  --ink:#F3F4F6; --muted:#A3A7B2;
  --brand:#FC5315; --brand-ink:#1A0700; --brand-soft:#3A1608;
  --accent:#FF9300; --accent-ink:#1F1100; --blue:#0DC6FF;
  --ok:#3DDC84; --ok-bg:#10301F; --warn:#FFB340; --warn-bg:#3A2808; --bad:#FF5A5F; --bad-bg:#3D1416;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(34px,8vw,58px);font-weight:400;line-height:1;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:26px;font-weight:400;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:17px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:68px;height:42px;border-radius:0;background:transparent;color:var(--brand-ink);display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;display:block;line-height:1.1;overflow-wrap:anywhere}
.brand small{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none;order:3;flex-basis:100%}
nav.tabs button{background:none;border:0;padding:8px 13px;border-radius:99px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
nav.tabs button:hover:not([aria-selected="true"]){background:var(--surface-2);color:var(--ink)}
@media (min-width:900px){nav.tabs{order:0;flex-basis:auto}}

main{padding-block:20px 70px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;line-height:1.15;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);background:none}
.btn.danger.armed{background:var(--bad);color:#1a0000;border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:17px;height:17px}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-weight:700;font-size:12px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.neu{background:var(--surface-2);color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:19px;margin-bottom:4px}
.notice{background:var(--warn-bg);border:1px solid #6a4a10;color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}

/* vitrine */
.hero{background:radial-gradient(120% 140% at 0% 0%,rgba(252,83,21,.55),transparent 55%),radial-gradient(120% 140% at 100% 100%,rgba(13,198,255,.45),transparent 55%),#0E0F13;border:1px solid var(--line);color:var(--ink);align-items:flex-start;border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero p{margin:0;opacity:.9;max-width:52ch}
.hero-logo{width:min(320px,80%);height:auto;display:block;margin-bottom:4px}
.hero .tag b{color:var(--accent)}
.hero .info{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;opacity:.95}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.room{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.room svg{width:30px;height:30px;color:var(--blue)}
.room b{font-family:var(--f-display);font-size:19px;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.room span{font-size:12px;color:var(--muted)}
.room[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;max-width:100%;background:radial-gradient(circle at 30% 20%,#3a2a24,var(--surface-2) 60%);display:grid;place-items:center;color:var(--blue);position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:44%;height:44%;opacity:.55}
.ph .pill{position:absolute;top:8px;left:8px}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .sub{font-size:12px;color:var(--muted);font-weight:600}
.card .nm{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.card .pr{font-family:var(--f-display);font-size:24px;font-weight:400;color:var(--accent);margin-top:auto;padding-top:6px}
.card .btn{justify-content:center;margin-top:6px}
.sec-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.sec-h svg{width:26px;height:26px;color:var(--blue)}
.search{position:relative}
.search input{padding-left:38px;border-radius:99px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}

/* gestão */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:clamp(21px,5.6vw,28px);overflow-wrap:anywhere;font-weight:400;line-height:1.05;letter-spacing:.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero2{background:linear-gradient(135deg,var(--brand),var(--accent));border-color:var(--brand);color:var(--brand-ink)}
.kpi.hero2 .label,.kpi.hero2 .s{color:inherit;opacity:.85}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px}
.bar .fl.out{background:var(--blue)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--surface-2);vertical-align:middle}
td.r,th.r{text-align:right}
.thumb{width:40px;height:40px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--blue);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb svg{width:22px;height:22px}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(500px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pay{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pay button{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.pay button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.copybox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-weight:700;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#09090C;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
footer{color:var(--muted);font-size:12px;text-align:center;padding-block:10px 30px}
@media (max-width:760px){.cols2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.grid2{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.bar{grid-template-columns:minmax(0,92px) minmax(0,1fr) auto}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

function range(p){const t=iso();const d=new Date();

  if(p==="7d"){d.setDate(d.getDate()-6);return[iso(d),t]}
  if(p==="mes")return[t.slice(0,8)+"01",t];
  if(p==="mesant"){const a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);return[iso(a),iso(b)]}
  return["0000-00-00","9999-12-31"]}
const PER=[["hoje","Hoje"],["7d","7 dias"],["mes","Este mês"],["mesant","Mês passado"],["tudo","Tudo"]];
const perChips=()=>`<div class="chips">${PER.map(([k,n])=>`<button class="chip" data-act="per" data-v="${k}" aria-pressed="${S.periodo===k}">${n}</button>`).join("")}</div>`;
const inP=(x)=>{const[a,b]=range(S.periodo);return x.data>=a&&x.data<=b};

/* ---------- render ---------- */
function foto(p,cls){return p.fotoUrl?`<img src="${esc(p.fotoUrl)}" alt="" loading="lazy">`:svg(p.comodo)}
function render(){
  const a=document.activeElement;const fid=a&&a.id&&app.contains(a)?a.id:null;const pos=fid&&a.selectionStart!=null?a.selectionStart:null;
  const c=S.cfg;const nome=c.nome||"R&E Tech Eletrônicos";
  const tabs=[["painel","Relatórios"],["vendas","Vendas"],["estoque","Estoque"],["despesas","Despesas"],["caixa","Caixa"],["config","Loja"]];
  app.innerHTML=`<header class="top"><div class="wrap top-in">
     <div class="brand"><div class="logo"><img src="${esc(c.logoUrl||LOGO)}" alt="" style="object-fit:contain"></div><div style="min-width:0"><b>${esc(nome)}</b><small>${S.modo==="admin"?"Gestão da loja":esc(c.slogan||"Tecnologia que facilita sua vida!")}</small></div></div>
     ${S.admin?(S.modo==="admin"?`<nav class="tabs" role="tablist">${tabs.map(([k,n])=>`<button role="tab" data-act="tab" data-v="${k}" aria-selected="${S.tab===k}">${n}</button>`).join("")}</nav><button class="btn sm acc" data-act="modo" data-v="cliente">Ver vitrine</button><button class="btn sm ghost" data-act="sair">Sair</button>`
       :`<button class="btn sm pri" data-act="modo" data-v="admin">Voltar pra gestão</button>`):`<button class="btn sm ghost" data-act="login">Área da loja</button>`}
   </div></header>
   <main class="wrap">${DEMO&&S.admin?`<div class="notice row" style="justify-content:space-between"><span><b>Protótipo de demonstração.</b> Pode testar tudo: vender, cadastrar, lançar despesa. Nada aqui é enviado pra loja.</span><button class="btn sm" data-act="reset-demo">Recomeçar demonstração</button></div>`:""}${S.modo==="admin"?gestao():vitrine()}</main>
   <footer class="wrap">${S.modo==="admin"&&!DEMO?"Dados salvos online · ":""}Site desenvolvido por BEMAPA CORP</footer>`;
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(pos!=null&&el.setSelectionRange)try{el.setSelectionRange(pos,pos)}catch(e){}}}
}

/* ---------- vitrine (clientes) ---------- */
function vitrine(){
  const c=S.cfg;const ativos=S.produtos.filter(p=>p.ativo!==false);
  const q=S.busca.trim().toLowerCase();
  let lista=ativos.filter(p=>(S.comodo==="todos"||p.comodo===S.comodo)&&(!S.sub||p.sub===S.sub)&&(!q||(p.nome+" "+(p.sub||"")+" "+(p.desc||"")).toLowerCase().includes(q)));
  const cont=id=>ativos.filter(p=>p.comodo===id).length;
  const rooms=`<div class="rooms">${[{id:"todos",nome:"Tudo"},...COMODOS].map(k=>`<button class="room" data-act="com" data-v="${k.id}" aria-pressed="${S.comodo===k.id}">${svg(k.id)}<b>${k.nome}</b><span>${k.id==="todos"?ativos.length:cont(k.id)} produtos</span></button>`).join("")}</div>`;
  let subs="";
  if(S.comodo!=="todos"){const cm=comodo(S.comodo);const usadas=[...new Set(ativos.filter(p=>p.comodo===S.comodo).map(p=>p.sub).filter(Boolean))];
    if(usadas.length) subs=`<div class="chips"><button class="chip" data-act="sub" data-v="" aria-pressed="${!S.sub}">Tudo de ${esc(cm.nome)}</button>${usadas.map(s=>`<button class="chip" data-act="sub" data-v="${esc(s)}" aria-pressed="${S.sub===s}">${esc(s)}</button>`).join("")}</div>`}
  const card=p=>{const e=+p.estoque||0;const st=e<=0?'<span class="pill bad">Esgotado</span>':e<=2?'<span class="pill warn">Últimas unidades</span>':'<span class="pill ok">Pronta entrega</span>';
    return `<article class="card"><div class="ph">${foto(p)}${st}</div><div class="bd"><span class="sub">${esc(comodo(p.comodo).nome)}${p.sub?" · "+esc(p.sub):""}</span><span class="nm">${esc(p.nome)}</span>${p.desc?`<span class="muted" style="font-size:13px">${esc(p.desc)}</span>`:""}<span class="pr num">${brl(p.preco)}</span><button class="btn pri" data-act="quero" data-v="${p.id}">Tenho interesse</button></div></article>`};
  let corpo;
  if(!ativos.length) corpo=`<div class="empty"><b>Vitrine em montagem</b>Os produtos da loja aparecem aqui em breve.</div>`;
  else if(!lista.length) corpo=`<div class="empty"><b>Nada encontrado</b>Tente outro cômodo ou outra palavra.</div>`;
  else if(S.comodo==="todos"&&!q) corpo=COMODOS.filter(k=>lista.some(p=>p.comodo===k.id)).map(k=>`<div class="sec-h">${svg(k.id)}<h2>${k.nome}</h2></div><div class="grid">${lista.filter(p=>p.comodo===k.id).map(card).join("")}</div>`).join("");
  else corpo=`<div class="grid">${lista.map(card).join("")}</div>`;
  const info=[c.endereco&&`📍 ${esc(c.endereco)}`,c.horario&&`🕘 ${esc(c.horario)}`,c.whatsapp&&`WhatsApp ${esc(c.whatsapp)}`].filter(Boolean);
  return `<section class="hero"><img class="hero-logo" src="${esc(c.logoUrl||LOGO)}" alt="${esc(c.nome||"R&E Tech Eletrônicos")}"><span class="label" style="color:var(--accent)">Escolha pelo cômodo da sua casa</span><p>${esc(c.slogan||"Tecnologia que facilita sua vida! Eletrodomésticos e eletrônicos pra cada cômodo da sua casa.")}</p>${info.length?`<div class="info">${info.map(i=>`<span>${i}</span>`).join("")}</div>`:""}</section>
   ${rooms}${subs}
   <div class="search">${svg("busca")}<input id="busca" type="search" placeholder="Buscar: televisão, geladeira, fone…" value="${esc(S.busca)}" autocomplete="off" aria-label="Buscar produto"></div>
   ${corpo}`;
}
function quero(id){
  const p=S.produtos.find(x=>x.id===id);if(!p)return;const w=fone(S.cfg.whatsapp);
  const msg=`Olá! Vi na vitrine e tenho interesse em: ${p.nome} (${brl(p.preco)}). Ainda tem?`;
  modal(`<span class="label">${esc(comodo(p.comodo).nome)}${p.sub?" · "+esc(p.sub):""}</span><h2>${esc(p.nome)}</h2><div class="row" style="justify-content:space-between"><span class="pr num" style="font-family:var(--f-display);font-size:28px;font-weight:800">${brl(p.preco)}</span>${(+p.estoque||0)>0?'<span class="pill ok">Disponível</span>':'<span class="pill bad">Esgotado — pergunte quando chega</span>'}</div>
   ${w?`<p class="muted" style="margin:0">Chame a loja no WhatsApp com a mensagem pronta:</p><div class="copybox"><span class="num" style="flex:1">${esc(S.cfg.whatsapp)}</span><button class="btn sm" id="cp">Copiar número</button></div>
     <a class="btn pri" style="justify-content:center;padding:13px" href="https://wa.me/${w}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Abrir WhatsApp</a>`
     :`<p class="muted" style="margin:0">Fale com a loja pessoalmente ou pelo telefone da loja para reservar.</p>`}
   <div class="acts"><button class="btn ghost" data-close>Fechar</button></div>`,(m)=>{const b=m.querySelector("#cp");if(b)b.onclick=()=>{navigator.clipboard.writeText(S.cfg.whatsapp).then(()=>toast("Número copiado"),()=>toast("Selecione o número e copie"))}});
}

/* ---------- gestão ---------- */
function gestao(){
  if(!S.loaded) return `<div class="empty"><b>Carregando dados da loja…</b></div>`;
  return ({painel,vendas:vendasV,estoque:estoqueV,despesas:despesasV,caixa:caixaV,config:configV}[S.tab]||painel)();
}
function bars(obj,cls=""){const ent=Object.entries(obj).sort((a,b)=>b[1]-a[1]);if(!ent.length)return`<p class="muted" style="margin:0">Sem dados no período.</p>`;const mx=Math.max(...ent.map(e=>e[1]))||1;
  return ent.map(([k,v])=>`<div class="bar"><span title="${esc(k)}">${esc(k)}</span><div class="tr"><div class="fl ${cls}" style="width:${Math.max(2,v/mx*100)}%"></div></div><span class="num">${brl(v)}</span></div>`).join("")}
const sumBy=(arr,key,val)=>arr.reduce((o,x)=>{const k=typeof key==="function"?key(x):x[key];o[k]=r2((o[k]||0)+(typeof val==="function"?val(x):x[val]));return o},{});
const privOf=id=>S.priv[id]||{};
const minimo=p=>{const m=privOf(p.id).minimo;return m==null?2:+m};

function painel(){
  const v=S.vendas.filter(inP),d=S.despesas.filter(inP);
  const fat=r2(v.reduce((s,x)=>s+(+x.total||0),0)),dsp=r2(d.reduce((s,x)=>s+(+x.valor||0),0));
  const custo=r2(v.reduce((s,x)=>s+(+x.custoUnit||0)*(+x.qtd||0),0));
  const saldo=r2(fat-dsp);const ticket=v.length?fat/v.length:0;
  const top=sumBy(v,"produtoNome","total");const topE=Object.fromEntries(Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6));
  const baixo=S.produtos.filter(p=>(+p.estoque||0)<=minimo(p));
  return `<div class="head"><div><span class="label">Resumo da loja</span><h2>Relatórios</h2></div>${perChips()}</div>
  <div class="kpis">
    <div class="kpi hero2"><span class="label">Vendas</span><span class="v num">${brl(fat)}</span><span class="s">${v.length} venda${v.length===1?"":"s"} · ticket médio ${brl(ticket)}</span></div>
    <div class="kpi"><span class="label">Despesas</span><span class="v num neg">${brl(dsp)}</span><span class="s">${d.length} lançamento${d.length===1?"":"s"}</span></div>
    <div class="kpi"><span class="label">Saldo (vendas − despesas)</span><span class="v num ${saldo>=0?"pos":"neg"}">${brl(saldo)}</span><span class="s">o que sobrou no período</span></div>
    <div class="kpi"><span class="label">Lucro nos produtos</span><span class="v num">${brl(fat-custo)}</span><span class="s">preço de venda − custo da peça</span></div>
  </div>
  <div class="cols2">
    <div class="panel"><h3 style="margin-bottom:12px">Vendas por cômodo</h3><div class="bars">${bars(sumBy(v,x=>comodo(x.comodo).nome,"total"))}</div></div>
    <div class="panel"><h3 style="margin-bottom:12px">Mais vendidos</h3><div class="bars">${bars(topE)}</div></div>
    <div class="panel"><h3 style="margin-bottom:12px">Despesas por categoria</h3><div class="bars">${bars(sumBy(d,"categoria","valor"),"out")}</div></div>
    <div class="panel"><h3 style="margin-bottom:12px">Formas de pagamento</h3><div class="bars">${bars(sumBy(v,"pagamento","total"))}</div></div>
  </div>
  <div class="panel"><div class="head" style="margin-bottom:10px"><h3>Estoque baixo</h3><button class="btn sm" data-act="tab" data-v="estoque">Abrir estoque</button></div>
   ${baixo.length?`<div class="chips" style="flex-wrap:wrap">${baixo.map(p=>`<span class="pill ${(+p.estoque||0)<=0?"bad":"warn"}">${esc(p.nome)} · ${+p.estoque||0} un.</span>`).join("")}</div>`:`<p class="muted" style="margin:0">Tudo com estoque acima do mínimo.</p>`}</div>`;
}

function vendasV(){
  const v=S.vendas.filter(inP);const tot=r2(v.reduce((s,x)=>s+(+x.total||0),0));
  return `<div class="head"><div><span class="label">Quadro de vendas</span><h2>Vendas</h2></div><button class="btn pri" data-act="nova-venda">+ Nova venda</button></div>
  <div class="row" style="justify-content:space-between">${perChips()}<span class="muted">Total: <b class="num" style="color:var(--ink)">${brl(tot)}</b></span></div>
  ${v.length?`<div class="panel tbl-wrap"><table><thead><tr><th>Data</th><th>Produto</th><th class="hide-sm">Cômodo</th><th class="r">Qtd</th><th class="hide-sm">Pagamento</th><th class="hide-sm">Cliente</th><th class="r">Total</th><th></th></tr></thead><tbody>
   ${v.map(x=>`<tr><td class="num">${fmtD(x.data)}</td><td>${esc(x.produtoNome)}</td><td class="hide-sm">${esc(comodo(x.comodo).nome)}</td><td class="r num">${x.qtd}</td><td class="hide-sm">${esc(x.pagamento)}</td><td class="hide-sm">${esc(x.cliente||"—")}</td><td class="r num"><b>${brl(x.total)}</b></td><td class="r"><button class="btn sm danger" data-act="del-venda" data-v="${x.id}">Apagar</button></td></tr>`).join("")}
   </tbody></table></div>`:`<div class="empty"><b>Nenhuma venda no período</b>Toque em “Nova venda” para lançar. O estoque baixa sozinho.</div>`}`;
}

function estoqueV(){
  const q=S.estBusca.trim().toLowerCase();
  const list=S.produtos.filter(p=>(S.estCom==="todos"||p.comodo===S.estCom)&&(!q||p.nome.toLowerCase().includes(q))).sort((a,b)=>COMODOS.findIndex(c=>c.id===a.comodo)-COMODOS.findIndex(c=>c.id===b.comodo)||a.nome.localeCompare(b.nome));
  const un=S.produtos.reduce((s,p)=>s+(+p.estoque||0),0),val=S.produtos.reduce((s,p)=>s+(+p.estoque||0)*(+p.preco||0),0);
  const baixo=S.produtos.filter(p=>(+p.estoque||0)<=minimo(p)).length;
  const vEm=S.cfg.vitrineEm||0;const pub=vEm?new Date(vEm).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):null;
  return `<div class="head"><div><span class="label">Produtos e quantidades</span><h2>Estoque</h2></div><div class="row"><button class="btn pri" data-act="novo-prod">+ Produto</button></div></div>
  <div class="kpis"><div class="kpi"><span class="label">Produtos</span><span class="v num">${S.produtos.length}</span></div><div class="kpi"><span class="label">Unidades</span><span class="v num">${un}</span></div><div class="kpi"><span class="label">Valor em estoque</span><span class="v num">${brl(val)}</span><span class="s">pelo preço de venda</span></div><div class="kpi"><span class="label">Estoque baixo</span><span class="v num ${baixo?"neg":""}">${baixo}</span></div></div>
  ${dlCap?`<div class="notice row" style="justify-content:space-between"><span>Vitrine dos clientes (GitHub Pages)${pub?` · último arquivo gerado em ${pub}`:" · ainda não gerada"}. Mudou produto ou preço? Gere o arquivo e suba no GitHub como <b>index.html</b>.</span><button class="btn sm acc" data-act="publicar">Atualizar vitrine</button></div>`:""}
  <div class="row"><div style="flex:1;min-width:180px"><input id="estBusca" placeholder="Buscar produto…" value="${esc(S.estBusca)}" autocomplete="off" aria-label="Buscar produto"></div></div>
  <div class="chips">${[{id:"todos",nome:"Todos"},...COMODOS].map(k=>`<button class="chip" data-act="estcom" data-v="${k.id}" aria-pressed="${S.estCom===k.id}">${svg(k.id)}${k.nome}</button>`).join("")}</div>
  ${list.length?`<div class="panel tbl-wrap"><table><thead><tr><th>Produto</th><th class="r">Preço</th><th class="r hide-sm">Custo</th><th>Estoque</th><th></th></tr></thead><tbody>
   ${list.map(p=>{const e=+p.estoque||0;const st=e<=0?'<span class="pill bad">Zerado</span>':e<=minimo(p)?'<span class="pill warn">Baixo</span>':'';return `<tr><td><div class="row" style="flex-wrap:nowrap"><div class="thumb">${foto(p)}</div><div style="min-width:0"><b>${esc(p.nome)}</b>${p.ativo===false?' <span class="pill neu">Fora da vitrine</span>':""}<div class="muted" style="font-size:12px">${esc(comodo(p.comodo).nome)}${p.sub?" · "+esc(p.sub):""}</div></div></div></td>
    <td class="r num">${brl(p.preco)}</td><td class="r num hide-sm">${privOf(p.id).custo!=null?brl(privOf(p.id).custo):"—"}</td>
    <td><div class="qty"><button data-act="est" data-v="${p.id}" data-d="-1" aria-label="Tirar um">−</button><b class="num" style="min-width:24px;text-align:center">${e}</b><button data-act="est" data-v="${p.id}" data-d="1" aria-label="Mais um">+</button></div> ${st}</td>
    <td class="r"><button class="btn sm" data-act="edit-prod" data-v="${p.id}">Editar</button></td></tr>`}).join("")}</tbody></table></div>`
   :`<div class="empty"><b>${S.produtos.length?"Nenhum produto aqui":"Cadastre o primeiro produto"}</b>Escolha o cômodo (Sala, Quarto, Cozinha…) e o tipo (Televisão, Geladeira, Celular…).</div>`}`;
}

function despesasV(){
  const d=S.despesas.filter(inP);const tot=r2(d.reduce((s,x)=>s+(+x.valor||0),0));
  return `<div class="head"><div><span class="label">Contas e gastos</span><h2>Despesas</h2></div><button class="btn pri" data-act="nova-desp">+ Lançar despesa</button></div>
  <div class="row" style="justify-content:space-between">${perChips()}<span class="muted">Total: <b class="num neg">${brl(tot)}</b></span></div>
  ${d.length?`<div class="panel tbl-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th class="hide-sm">Categoria</th><th class="hide-sm">Pago com</th><th class="r">Valor</th><th></th></tr></thead><tbody>
   ${d.map(x=>`<tr><td class="num">${fmtD(x.data)}</td><td>${esc(x.descricao)}</td><td class="hide-sm">${esc(x.categoria)}</td><td class="hide-sm">${esc(x.pagamento||"—")}</td><td class="r num"><b>${brl(x.valor)}</b></td><td class="r"><button class="btn sm danger" data-act="del-desp" data-v="${x.id}">Apagar</button></td></tr>`).join("")}
   </tbody></table></div>`:`<div class="empty"><b>Nenhuma despesa no período</b>Lance aluguel, luz, fornecedor, frete… e o relatório calcula o saldo.</div>`}`;
}

function caixaV(){
  const v=S.vendas.filter(inP),d=S.despesas.filter(inP);
  const mov=[...v.map(x=>({data:x.data,ts:x.ts||0,desc:`Venda · ${x.produtoNome}${x.qtd>1?" ×"+x.qtd:""}`,forma:x.pagamento,val:+x.total||0})),...d.map(x=>({data:x.data,ts:x.ts||0,desc:`Despesa · ${x.descricao}`,forma:x.pagamento||"—",val:-(+x.valor||0)}))].sort((a,b)=>b.data.localeCompare(a.data)||b.ts-a.ts);
  const ent=r2(v.reduce((s,x)=>s+(+x.total||0),0)),sai=r2(d.reduce((s,x)=>s+(+x.valor||0),0));
  const din=r2(v.filter(x=>x.pagamento==="Dinheiro").reduce((s,x)=>s+(+x.total||0),0)-d.filter(x=>x.pagamento==="Dinheiro").reduce((s,x)=>s+(+x.valor||0),0));
  return `<div class="head"><div><span class="label">Fluxo de caixa</span><h2>Caixa</h2></div>${perChips()}</div>
  <div class="kpis"><div class="kpi"><span class="label">Entradas</span><span class="v num pos">${brl(ent)}</span></div><div class="kpi"><span class="label">Saídas</span><span class="v num neg">${brl(sai)}</span></div><div class="kpi hero2"><span class="label">Saldo</span><span class="v num">${brl(ent-sai)}</span></div><div class="kpi"><span class="label">Dinheiro na gaveta</span><span class="v num">${brl(din)}</span><span class="s">entradas − saídas em dinheiro</span></div></div>
  ${mov.length?`<div class="panel tbl-wrap"><table><thead><tr><th>Data</th><th>Movimento</th><th class="hide-sm">Forma</th><th class="r">Valor</th></tr></thead><tbody>${mov.map(m=>`<tr><td class="num">${fmtD(m.data)}</td><td>${esc(m.desc)}</td><td class="hide-sm">${esc(m.forma)}</td><td class="r num ${m.val>=0?"pos":"neg"}"><b>${m.val>=0?"+ ":"− "}${brl(Math.abs(m.val))}</b></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><b>Sem movimento no período</b>Vendas e despesas lançadas aparecem aqui.</div>`}`;
}

  const c=S.cfg;const ex=S.produtos.some(p=>p.exemplo)||S.vendas.some(p=>p.exemplo)||S.despesas.some(p=>p.exemplo);
  return `<div class="head"><div><span class="label">Dados que aparecem na vitrine</span><h2>Loja</h2></div></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:12px;max-width:640px">
   <div class="row"><div class="logo" style="width:96px;height:64px"><img src="${esc(c.logoUrl||LOGO)}" alt="" style="object-fit:contain"></div>${assets?`<label class="btn sm" for="cfgLogo">Usar outro logotipo</label><input type="file" id="cfgLogo" accept="image/*" hidden>`:""}${c.logoUrl?`<button class="btn sm danger" data-act="tira-logo">Remover</button>`:""}</div>
   <div class="field"><label class="label" for="cfgNome">Nome da loja</label><input id="cfgNome" value="${esc(c.nome||"")}" placeholder="R&amp;E Tech Eletrônicos"></div>
   <div class="field"><label class="label" for="cfgSlogan">Frase da vitrine</label><input id="cfgSlogan" value="${esc(c.slogan||"")}" placeholder="Tecnologia que facilita sua vida!"></div>

/* ---------- vitrine pública (arquivo para o GitHub Pages) ---------- */
async function toData(url,max){
  if(!url||url.startsWith("data:"))return url||"";
  try{const blob=await (await fetch(url)).blob();const bmp=await createImageBitmap(blob);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return cv.toDataURL("image/jpeg",.8)}catch(e){console.error(e);return ""}}
async function publicar(btn){
  if(!dlCap)return;btn.disabled=true;btn.textContent="Gerando…";
  try{
    const prods=[];
    for(const p of S.produtos.filter(p=>p.ativo!==false)){const {id,nome,comodo,sub,preco,estoque,desc}=p;prods.push({id,nome,comodo,sub,preco,estoque,desc,fotoUrl:await toData(p.fotoUrl,600)})}
    const cfg={nome:S.cfg.nome||"",slogan:S.cfg.slogan||"",whatsapp:S.cfg.whatsapp||"",horario:S.cfg.horario||"",endereco:S.cfg.endereco||"",logoUrl:await toData(S.cfg.logoUrl,500)};
    const data=JSON.stringify({cfg,produtos:prods,publicadoEm:Date.now()}).replace(/</g,"\\u003c");
    const css=document.getElementById("app-css").textContent,js=document.getElementById("app-js").textContent;
    const fonts='<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap">';
    const html='<!doctype html>\n<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
      +'<title>'+esc(cfg.nome||"R&E Tech Eletrônicos")+'</title><meta name="description" content="'+esc(cfg.slogan||"Tecnologia que facilita sua vida!")+'">'+fonts
      +'<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>'
      +'<style id="app-css">'+css+'</style></head><body>\n<div id="app"></div>\n<script type="application/json" id="vitrine-data">'+data+'<\/script>\n<script id="app-js">'+js+'<\/script>\n</body></html>';
    const r=await dlCap.save({filename:"index.html",data:new Blob([html],{type:"text/html"})});
    if(r&&r.status==="saved"){toast("Arquivo index.html salvo. Agora suba no GitHub.");safe(db.doc("loja/config").set({...S.cfg,vitrineEm:Date.now()}))}
  }catch(e){if(!(e&&e.code==="cancelled"))console.error(e);if(e&&e.code&&e.code!=="cancelled")toast("Não foi possível gerar o arquivo agora.")}
  btn.disabled=false;btn.textContent="Atualizar vitrine";
}

const KEY="re-tech-demo-v2";let MEM={};
const split=p=>{const i=p.lastIndexOf("/");return[p.slice(0,i),p.slice(i+1)]};
const rows=c=>Object.entries(MEM[c]||{}).map(([id,d])=>({id,...d}));
const byDate=(a,b)=>b.data.localeCompare(a.data)||(b.ts||0)-(a.ts||0);
function sync(){S.cfg=(MEM.loja||{}).config||{};S.produtos=rows("produtos");S.priv={...(MEM["gestao/admin/produtos"]||{})};
  S.vendas=rows("gestao/admin/vendas").sort(byDate);S.despesas=rows("gestao/admin/despesas").sort(byDate);
  try{localStorage.setItem(KEY,JSON.stringify(MEM))}catch(e){}render()}
const newId=()=>"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
db={doc:p=>{const[c,id]=split(p);return{id,
    set:async d=>{(MEM[c]=MEM[c]||{})[id]=JSON.parse(JSON.stringify(d));sync()},
    update:async d=>{if(!(MEM[c]&&MEM[c][id]))throw{code:"invalid_argument"};Object.assign(MEM[c][id],d);sync()},
    delete:async()=>{if(MEM[c])delete MEM[c][id];sync()}}},
  collection:c=>({doc:id=>db.doc(c+"/"+(id||newId())),add:async d=>{const r=db.doc(c+"/"+newId());await r.set(d);return r}})};
assets={upload:f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,600/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);ok({id:newId(),url:cv.toDataURL("image/jpeg",.8)})};img.onerror=no;img.src=r.result};r.onerror=no;r.readAsDataURL(f)})};

    const go=async()=>{const u=$("#lgU").value.trim().toLowerCase(),p=$("#lgS").value;$("#lgE").textContent="Entrando…";
      try{await entrar(u,p);close()}catch(e){$("#lgE").textContent=e&&e.msg||"Usuário ou senha incorretos."}};
    $("#lgOk").onclick=go;$("#lgS").onkeydown=e=>{if(e.key==="Enter")go()};$("#lgU").onkeydown=e=>{if(e.key==="Enter")$("#lgS").focus()};
  });
}
async function entrar(u,p){
  if(DEMO){throw 0}
  if(!fauth)throw{msg:"Sem conexão. Tente de novo."};
  await fauth.signInWithEmailAndPassword(u.includes("@")?u:u+"@retech.app",p);
}
let unsubs=[];
function virarAdmin(){if(S.admin)return;S.admin=true;S.modo="admin";S.tab="painel";if(!DEMO)subGestao();render();scrollTo(0,0)}
function sair(){if(DEMO){try{sessionStorage.removeItem("re-adm")}catch(e){}S.admin=false;S.modo="cliente";render();return}fauth&&fauth.signOut()}
function subGestao(){
  const f=firebase.firestore(),list=s=>s.docs.map(x=>({id:x.id,...x.data()}));
  unsubs.push(f.collection("gestao/admin/vendas").onSnapshot(s=>{S.vendas=list(s).sort(byDate);render()},console.error));
  unsubs.push(f.collection("gestao/admin/despesas").onSnapshot(s=>{S.despesas=list(s).sort(byDate);render()},console.error));
  unsubs.push(f.collection("gestao/admin/produtos").onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());S.priv=o;render()},console.error));
}
const loadJs=src=>new Promise((ok,no)=>{const t=document.createElement("script");t.src=src;t.onload=ok;t.onerror=no;document.head.appendChild(t)});
async function iniciarOnline(){
  const v="https://www.gstatic.com/firebasejs/10.12.2/";
  for(const f of["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js"])await loadJs(v+f);
  firebase.initializeApp(FIREBASE_CONFIG);const f=firebase.firestore();fauth=firebase.auth();
  db={doc:p=>{const r=f.doc(p);return{id:r.id,set:d=>r.set(d),update:d=>r.update(d),delete:()=>r.delete()}},
      collection:c=>({doc:id=>db.doc(c+"/"+(id||f.collection(c).doc().id)),add:d=>f.collection(c).add(d)})};
  f.doc("loja/config").onSnapshot(s=>{if(s.exists)S.cfg=s.data();render()},console.error);
  f.collection("produtos").onSnapshot(s=>{S.produtos=s.docs.map(x=>({id:x.id,...x.data()}));S.loaded=true;render()},console.error);
  fauth.onAuthStateChanged(u=>{if(u)virarAdmin();else{unsubs.forEach(x=>x());unsubs=[];S.admin=false;S.modo="cliente";S.vendas=[];S.despesas=[];S.priv={};render()}});
}
S.modo="cliente";
if(DEMO){
  S.loaded=true;
  try{const m=JSON.parse(localStorage.getItem(KEY)||"null");if(m&&m.produtos){MEM=m;sync()}else seed()}catch(e){seed()}
  try{if(sessionStorage.getItem("re-adm"))virarAdmin()}catch(e){}
}else{render();iniciarOnline().catch(e=>{console.error(e);toast("Não foi possível conectar. Verifique a internet.")})}
if(location.hash==="#gestao"&&!S.admin)setTimeout(formLogin,300);
})();
</script>
